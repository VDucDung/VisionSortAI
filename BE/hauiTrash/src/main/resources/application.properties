spring.application.name=hauiTrash
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
spring.config.import=optional:file:./application-local.properties
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/HauiTrash?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
ai.yolo.base-url=${AI_BASE_URL:http://localhost:8000}
# Blank uses the mounted /details service in the usual AI process.
# Set AI_COMPONENTS_BASE_URL=http://127.0.0.1:8011 only for a separate process.
ai.components.base-url=${AI_COMPONENTS_BASE_URL:}
app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.admin.email=${ADMIN_EMAIL:}
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.phone=${ADMIN_PHONE:}
app.admin.update-existing=${ADMIN_UPDATE_EXISTING:false}
# Legacy clients are retained in source, but their endpoints are retired.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com
gemini.temperature=0.2
gemini.timeout-seconds=60
gemini.embedding-model=text-embedding-004
social.google.client-id=
social.facebook.app-id=
social.facebook.app-secret=
